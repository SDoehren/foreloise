<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Love you!</title>
</head>
<body>
<div id="message"></div>
</body>
</html>

<script>
    const names = ["Eloise","Eloizzle",""]
    const randomname = Math.floor(Math.random() * names.length);

    const messageel = document.getElementById('message');
    var message = ""

    function sendmessage(letter) {
        message += letter
        messageel.innerHTML = message
    }

    const letteratatime = async (message) => {
        for (let i = 0; i < message.length; i++) {
            if (message[i]==" "){
                let delayres = await delay(75);
            } else if (message[i]=="x"){
                let delayres = await delay(15);
            } else {
                let delayres = await delay(25);
            }
            sendmessage(message[i])
        }
    }


    const delay = (delayInms) => {
        return new Promise(resolve => setTimeout(resolve, delayInms));
    };

    const sample = async () => {

        var r = Math.random()

        await letteratatime("Hey "+names[randomname])
        message += "<br>"

        const love = ["LOVE YOU!!!","LOVE YOU SO MUCH!!!!","LOVE YOU VERY MUCH!!!","LOVE YOU MORE!","SOOOO"]
        const randomlove = Math.floor(Math.random() * love.length);

        if (love[randomlove]==="SOOOO"){
            await letteratatime("LOVE YOU S")
            var l = Math.floor(Math.random() * 100)+10
            for (let i = 0; i < l; i++) {
                    await letteratatime("O")
            }
            await letteratatime(" MUCH!")
        } else {
            await letteratatime(love[randomlove])
        }

        message += "<br>"

        await letteratatime("X")
        while (true) {
            for (let i = 0; i < 40; i++) {
                    await letteratatime("x")
            }
            message += "<br>"
        }
    };
    sample();

</script>
